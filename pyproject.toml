[build-system]
# >=77 is required for the SPDX license expression below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diffuse"
version = "0.1.0"
description = "Self-hosted GitHub pull-request review"
requires-python = ">=3.12"
license = "BUSL-1.1"
license-files = ["LICENSE"]
# Diffuse is distributed as a self-hosted application, not through PyPI.
# Keep the upload guard even though the source is published under BSL 1.1.
classifiers = ["Private :: Do Not Upload"]
dynamic = ["dependencies"]

[project.scripts]
diffuse = "diffuse.main:main"

[tool.setuptools.packages.find]
where = [
    "packages/server/src",
    "packages/host/src",
    "packages/protocol/src",
]
include = ["diffuse*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.data-files]
"share/diffuse/sql" = [
    "packages/server/migrations/*.sql",
    "packages/server/migrations/README.md",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/server/tests",
    "packages/host/tests",
    "packages/protocol/tests",
    "packages/relay/tests",
    "tests/integration",
]
pythonpath = [
    "packages/server/src",
    "packages/host/src",
    "packages/protocol/src",
    "packages/relay/src",
]
markers = [
    "integration: tests that require explicitly configured external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
