[build-system]
# >=77 is required for the SPDX license expression below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diffuse-code-review"
version = "0.1.0"
description = "Self-hostable code intelligence and review platform"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
# Diffuse is proprietary and must never be published to a public index.
# PyPI rejects any distribution carrying this classifier.
classifiers = ["Private :: Do Not Upload"]
dynamic = ["dependencies"]

[project.scripts]
diffuse = "service.review_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["indexer*", "repository_policy*", "retriever*", "service*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.data-files]
"share/diffuse/sql" = ["sql/schema.sql"]
"share/diffuse/sql/migrations" = ["sql/migrations/*.sql", "sql/migrations/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require explicitly configured external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
