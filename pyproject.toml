[build-system]
# >=77 is required for the SPDX license expression below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diffuse-code-review"
version = "0.1.0"
description = "Self-hostable code intelligence and review platform"
requires-python = ">=3.12"
license = "BUSL-1.1"
license-files = ["LICENSE"]
# Diffuse is distributed as a self-hosted application, not through PyPI.
# Keep the upload guard even though the source is published under BSL 1.1.
classifiers = ["Private :: Do Not Upload"]
dynamic = ["dependencies"]

[project.scripts]
diffuse = "service.review_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["indexer*", "repository_policy*", "retriever*", "service*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.data-files]
"share/diffuse/sql" = ["sql/schema.sql"]
"share/diffuse/sql/migrations" = ["sql/migrations/*.sql", "sql/migrations/README.md"]
# `evals/` holds no Python, so it is data, not a package -- adding "evals*" to
# packages.find above would silently match nothing. `diffuse evaluate` takes an
# explicit path argument and has no search path of its own, so shipping the files
# is the whole fix; the Dockerfile puts the same directory at
# /opt/diffuse/_internal/evals so the documented command has something to point at
# inside the image. See docs/roadmap.md.
"share/diffuse/evals" = ["evals/baseline.example.json", "evals/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require explicitly configured external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
