services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: diffuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: diffuse
    # Mirrors deploy/compose.yaml; see the comments there. 64MB of /dev/shm is not
    # enough to build the HNSW index on code_chunks for a large repository, and the
    # capability set is the minimum the PostgreSQL entrypoint needs to initdb and
    # step down from root.
    shm_size: 1gb
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffuse -d diffuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 1m

  migrate:
    build: .
    image: ${DIFFUSE_IMAGE:-diffuse:local}
    restart: "no"
    init: true
    # Mirrors deploy/compose.yaml. The dev profile has to run under the same
    # constraints the customer profile enforces, or a write-to-rootfs bug ships
    # undetected because it only fails on their machine.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["database", "migrate"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build: .
    image: ${DIFFUSE_IMAGE:-diffuse:local}
    restart: unless-stopped
    init: true
    # Mirrors deploy/compose.yaml. The dev profile has to run under the same
    # constraints the customer profile enforces, or a write-to-rootfs bug ships
    # undetected because it only fails on their machine.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
      DIFFUSE_API_TOKEN: ${DIFFUSE_API_TOKEN:?Set DIFFUSE_API_TOKEN in .env}
      DIFFUSE_PUBLIC_URL: ${DIFFUSE_PUBLIC_URL:?Set DIFFUSE_PUBLIC_URL in .env}
    ports:
      - "127.0.0.1:8000:8000"
    # REMOVED, mirroring deploy/compose.yaml: the read-only browser-sign-in secrets
    # mount. Nothing reads a secret from that path - there is no `diffuse login`
    # subcommand - and an unconditional bind mount of an undocumented host path gets
    # created root-owned by Compose on first `up`. See deploy/compose.yaml.
    volumes:
      - repository_data:/var/lib/diffuse/repositories
    tmpfs:
      - /tmp:size=256m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s

  worker:
    build: .
    image: ${DIFFUSE_IMAGE:-diffuse:local}
    restart: unless-stopped
    init: true
    # Mirrors deploy/compose.yaml. The dev profile has to run under the same
    # constraints the customer profile enforces, or a write-to-rootfs bug ships
    # undetected because it only fails on their machine.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
    volumes:
      - repository_data:/var/lib/diffuse/repositories
    tmpfs:
      - /tmp:size=512m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s

volumes:
  pgdata:
  repository_data:
