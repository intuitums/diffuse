services:
  db:
    # Nothing in Diffuse uses pgvector any more: migration 0010 dropped the
    # embedding column and the extension. The image still ships it because
    # `sql/schema.sql` is the frozen version-1 migration and still runs
    # `CREATE EXTENSION IF NOT EXISTS vector` on a fresh install, which stock
    # `postgres:17` cannot satisfy. Swapping this is a one-line change once the
    # version-1 baseline is re-cut.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: diffuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: diffuse
    # Mirrors deploy/compose.yaml; see the comments there. 64MB of /dev/shm is not
    # enough for PostgreSQL's parallel query workers on a large snapshot, and the
    # capability set is the minimum the PostgreSQL entrypoint needs to initdb and
    # step down from root.
    shm_size: 1gb
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffuse -d diffuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 1m
    networks: [backend]

  migrate:
    # The ONLY service that declares `build:`. `app` and `worker` run the same
    # image and reference the tag alone. When more than one service builds the
    # same tag, BuildKit runs the builds concurrently and they race to export
    # it: whichever loses fails the whole command with
    # `image "docker.io/library/diffuse:local": already exists`, so a clean
    # `docker compose up -d --build` exits 1 on the first run and only succeeds
    # on the second. Building here rather than on `app` is deliberate: `migrate`
    # is the service both others gate on, so the image exists before anything
    # that needs it starts.
    #
    # Documented usage is `docker compose up -d --build`, which is silent. A
    # bare `docker compose up -d` with no local image first prints three
    # `pull access denied for diffuse` lines: Compose resolves the two
    # image-only services before the build runs and tries the registry. It then
    # builds here and starts normally, so the errors are cosmetic. Do not
    # "fix" them by restoring `build:` on the other services.
    build: .
    image: ${DIFFUSE_IMAGE:-diffuse:local}
    restart: "no"
    init: true
    # Mirrors deploy/compose.yaml. The dev profile has to run under the same
    # constraints the customer profile enforces, or a write-to-rootfs bug ships
    # undetected because it only fails on their machine.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["database", "migrate"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
      # Dispatch signing is worker-only; migrations never need authority to
      # create a runner job even though their shared env file contains it.
      DIFFUSE_AGENT_DISPATCH_PRIVATE_KEY: ""
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [backend]

  app:
    # No `build:` — see the comment on `migrate`. `depends_on` guarantees
    # `migrate` has already built and run this exact tag.
    image: ${DIFFUSE_IMAGE:-diffuse:local}
    restart: unless-stopped
    init: true
    # Mirrors deploy/compose.yaml. The dev profile has to run under the same
    # constraints the customer profile enforces, or a write-to-rootfs bug ships
    # undetected because it only fails on their machine.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
      DIFFUSE_PUBLIC_URL: ${DIFFUSE_PUBLIC_URL:?Set DIFFUSE_PUBLIC_URL in .env}
      # The API verifies capability tools but must not be able to mint a
      # worker-to-runner dispatch envelope.
      DIFFUSE_AGENT_DISPATCH_PRIVATE_KEY: ""
    ports:
      - "127.0.0.1:8000:8000"
    # REMOVED, mirroring deploy/compose.yaml: the read-only browser-sign-in secrets
    # mount. Nothing reads a secret from that path - there is no `diffuse login`
    # subcommand - and an unconditional bind mount of an undocumented host path gets
    # created root-owned by Compose on first `up`. See deploy/compose.yaml.
    volumes:
      - repository_data:/var/lib/diffuse/repositories
    tmpfs:
      - /tmp:size=256m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    networks: [backend, control_egress]

  worker:
    # No `build:` — see the comment on `migrate`. `depends_on` guarantees
    # `migrate` has already built and run this exact tag.
    image: ${DIFFUSE_IMAGE:-diffuse:local}
    restart: unless-stopped
    init: true
    # Mirrors deploy/compose.yaml. The dev profile has to run under the same
    # constraints the customer profile enforces, or a write-to-rootfs bug ships
    # undetected because it only fails on their machine.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
    volumes:
      - repository_data:/var/lib/diffuse/repositories
    tmpfs:
      - /tmp:size=512m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    networks: [backend, runner_control_claude, runner_control_codex, control_egress]

  # Gate B: long-lived credential-isolated agent-runner. The worker never mounts
  # agent credentials and never executes a CLI. This service is the only Compose
  # writer of `agent_data`. It deliberately has no `env_file` (no database /
  # GitHub / API secrets). Opt in with the matching
  # `docker compose --profile agent-claude` or `--profile agent-codex`.
  agent-runner-claude:
    image: ${DIFFUSE_CLAUDE_RUNNER_IMAGE:-diffuse-runner-claude:local}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # `docker compose run … agent login` still overrides this daemon command for
    # operator sign-in.
    command: ["agent-runner"]
    profiles: ["agent-claude"]
    healthcheck:
      test: ["CMD", "diffuse", "agent-runner-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 6
    depends_on:
      egress-proxy-claude:
        condition: service_healthy
    environment:
      HOME: /var/lib/diffuse/agent/home
      DIFFUSE_AGENT_HOME: /var/lib/diffuse/agent
      DIFFUSE_AGENT_RUNTIME: claude
      DIFFUSE_AGENT_DISPATCH_PUBLIC_KEY: ${DIFFUSE_AGENT_DISPATCH_PUBLIC_KEY:?Set DIFFUSE_AGENT_DISPATCH_PUBLIC_KEY in .env}
      DIFFUSE_RUNNER_IMAGE_VERSION: ${DIFFUSE_CLAUDE_RUNNER_IMAGE:-diffuse-runner-claude:local}
      # The runner has no direct external network. Route vendor login and future
      # CLI calls through the allowlisted CONNECT proxy instead.
      HTTP_PROXY: http://egress-proxy-claude:3128
      HTTPS_PROXY: http://egress-proxy-claude:3128
      NO_PROXY: agent-tool-gateway,egress-proxy-claude,localhost,127.0.0.1
      DIFFUSE_AGENT_MODEL_HOST: ${DIFFUSE_CLAUDE_MODEL_HOST:-api.anthropic.com}
      DIFFUSE_AGENT_EGRESS_PROXY_HOST: egress-proxy-claude
      # The runner can reach only this capability-checked control-plane surface
      # over the private agent_mcp network, with one signed session capability.
      DIFFUSE_AGENT_TOOL_URL: http://agent-tool-gateway:8011/agent/v1
    volumes:
      - claude_agent_data:/var/lib/diffuse/agent
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [agent_mcp_claude, agent_egress_claude, runner_control_claude]

  # Codex keeps an independent executable, login cache, and egress allowlist.
  # It is deployed alongside Claude because trusted PR provenance can route a
  # review to the opposing family.
  agent-runner-codex:
    image: ${DIFFUSE_CODEX_RUNNER_IMAGE:-diffuse-runner-codex:local}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["agent-runner"]
    profiles: ["agent-codex"]
    healthcheck:
      test: ["CMD", "diffuse", "agent-runner-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 6
    depends_on:
      egress-proxy-codex:
        condition: service_healthy
    environment:
      HOME: /var/lib/diffuse/agent/home
      DIFFUSE_AGENT_HOME: /var/lib/diffuse/agent
      DIFFUSE_AGENT_RUNTIME: codex
      DIFFUSE_AGENT_DISPATCH_PUBLIC_KEY: ${DIFFUSE_AGENT_DISPATCH_PUBLIC_KEY:?Set DIFFUSE_AGENT_DISPATCH_PUBLIC_KEY in .env}
      DIFFUSE_RUNNER_IMAGE_VERSION: ${DIFFUSE_CODEX_RUNNER_IMAGE:-diffuse-runner-codex:local}
      HTTP_PROXY: http://egress-proxy-codex:3128
      HTTPS_PROXY: http://egress-proxy-codex:3128
      NO_PROXY: agent-tool-gateway,egress-proxy-codex,localhost,127.0.0.1
      DIFFUSE_AGENT_MODEL_HOST: ${DIFFUSE_CODEX_MODEL_HOST:-api.openai.com}
      DIFFUSE_AGENT_EGRESS_PROXY_HOST: egress-proxy-codex
      DIFFUSE_AGENT_TOOL_URL: http://agent-tool-gateway:8011/agent/v1
    volumes:
      - codex_agent_data:/var/lib/diffuse/agent
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [agent_mcp_codex, agent_egress_codex, runner_control_codex]

  # Docker networks do not constrain HTTP paths. The runners join only this
  # credential-free gateway, which exposes the capability tool and nothing else.
  agent-tool-gateway:
    image: ${DIFFUSE_IMAGE:-diffuse:local}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["agent-tool-gateway"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [backend, agent_mcp_claude, agent_mcp_codex]

  egress-proxy-claude:
    image: ${DIFFUSE_IMAGE:-diffuse:local}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["egress-proxy"]
    profiles: ["agent-claude"]
    environment:
      DIFFUSE_AGENT_MODEL_HOST: ${DIFFUSE_CLAUDE_MODEL_HOST:-api.anthropic.com}
    healthcheck:
      test: ["CMD", "diffuse", "egress-proxy-healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 10
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [agent_egress_claude, proxy_external]

  egress-proxy-codex:
    image: ${DIFFUSE_IMAGE:-diffuse:local}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["egress-proxy"]
    profiles: ["agent-codex"]
    environment:
      DIFFUSE_AGENT_MODEL_HOST: ${DIFFUSE_CODEX_MODEL_HOST:-api.openai.com}
    healthcheck:
      test: ["CMD", "diffuse", "egress-proxy-healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 10
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [agent_egress_codex, proxy_external]

volumes:
  pgdata:
  repository_data:
  claude_agent_data:
  codex_agent_data:

networks:
  backend:
    internal: true
  agent_mcp_claude:
    internal: true
  agent_mcp_codex:
    internal: true
  runner_control_claude:
    internal: true
  runner_control_codex:
    internal: true
  agent_egress_claude:
    internal: true
  agent_egress_codex:
    internal: true
  proxy_external:
    internal: false
  control_egress:
    internal: false
