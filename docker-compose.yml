services:
  db:
    # Nothing in Diffuse uses pgvector any more: migration 0010 dropped the
    # embedding column and the extension. The image still ships it because
    # `sql/schema.sql` is the frozen version-1 migration and still runs
    # `CREATE EXTENSION IF NOT EXISTS vector` on a fresh install, which stock
    # `postgres:17` cannot satisfy. Swapping this is a one-line change once the
    # version-1 baseline is re-cut.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: diffuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: diffuse
    # Mirrors deploy/compose.yaml; see the comments there. 64MB of /dev/shm is not
    # enough for PostgreSQL's parallel query workers on a large snapshot, and the
    # capability set is the minimum the PostgreSQL entrypoint needs to initdb and
    # step down from root.
    shm_size: 1gb
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffuse -d diffuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 1m
    networks: [backend]

  migrate:
    # The ONLY service that declares `build:`. `app` and `worker` run the same
    # image and reference the tag alone. When more than one service builds the
    # same tag, BuildKit runs the builds concurrently and they race to export
    # it: whichever loses fails the whole command with
    # `image "docker.io/library/diffuse:local": already exists`, so a clean
    # `docker compose up -d --build` exits 1 on the first run and only succeeds
    # on the second. Building here rather than on `app` is deliberate: `migrate`
    # is the service both others gate on, so the image exists before anything
    # that needs it starts.
    #
    # Documented usage is `docker compose up -d --build`, which is silent. A
    # bare `docker compose up -d` with no local image first prints three
    # `pull access denied for diffuse` lines: Compose resolves the two
    # image-only services before the build runs and tries the registry. It then
    # builds here and starts normally, so the errors are cosmetic. Do not
    # "fix" them by restoring `build:` on the other services.
    build: .
    image: ${DIFFUSE_IMAGE:-diffuse:local}
    restart: "no"
    init: true
    # Mirrors deploy/compose.yaml. The dev profile has to run under the same
    # constraints the customer profile enforces, or a write-to-rootfs bug ships
    # undetected because it only fails on their machine.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["database", "migrate"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [backend]

  app:
    # No `build:` — see the comment on `migrate`. `depends_on` guarantees
    # `migrate` has already built and run this exact tag.
    image: ${DIFFUSE_IMAGE:-diffuse:local}
    restart: unless-stopped
    init: true
    # Mirrors deploy/compose.yaml. The dev profile has to run under the same
    # constraints the customer profile enforces, or a write-to-rootfs bug ships
    # undetected because it only fails on their machine.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
      DIFFUSE_API_TOKEN: ${DIFFUSE_API_TOKEN:?Set DIFFUSE_API_TOKEN in .env}
      DIFFUSE_PUBLIC_URL: ${DIFFUSE_PUBLIC_URL:?Set DIFFUSE_PUBLIC_URL in .env}
    ports:
      - "127.0.0.1:8000:8000"
    # REMOVED, mirroring deploy/compose.yaml: the read-only browser-sign-in secrets
    # mount. Nothing reads a secret from that path - there is no `diffuse login`
    # subcommand - and an unconditional bind mount of an undocumented host path gets
    # created root-owned by Compose on first `up`. See deploy/compose.yaml.
    volumes:
      - repository_data:/var/lib/diffuse/repositories
    tmpfs:
      - /tmp:size=256m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    networks: [backend, agent_mcp]

  worker:
    # No `build:` — see the comment on `migrate`. `depends_on` guarantees
    # `migrate` has already built and run this exact tag.
    image: ${DIFFUSE_IMAGE:-diffuse:local}
    restart: unless-stopped
    init: true
    # Mirrors deploy/compose.yaml. The dev profile has to run under the same
    # constraints the customer profile enforces, or a write-to-rootfs bug ships
    # undetected because it only fails on their machine.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      agent-preflight:
        condition: service_completed_successfully
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
      # The image rootfs is read-only. Keep vendor fallback state (for example
      # Claude's legacy ~/.claude.json) beside the Diffuse-owned credential,
      # not under /home/diffuse or /tmp.
      DIFFUSE_AGENT_HOME: /var/lib/diffuse/agent
      HOME: /var/lib/diffuse/agent/home
    volumes:
      - repository_data:/var/lib/diffuse/repositories
      # Only worker mounts this mutable credential. `app` must never race a
      # vendor refresh token or receive a credential it cannot use.
      - agent_data:/var/lib/diffuse/agent
    tmpfs:
      - /tmp:size=512m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    networks: [backend, control_egress]

  # Mirrors deploy/compose.yaml. The preflight has an explicit, credential-free
  # environment; do not add the worker's env_file here.
  agent-preflight:
    image: ${DIFFUSE_IMAGE:-diffuse:local}
    restart: "no"
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["review-compartment-preflight"]
    healthcheck:
      disable: true
    depends_on:
      egress-proxy:
        condition: service_healthy
    environment:
      HOME: /var/lib/diffuse/agent
      DIFFUSE_AGENT_HOME: /var/lib/diffuse/agent
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: app,egress-proxy,localhost,127.0.0.1
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/lib/diffuse/agent:size=64m,mode=0700,uid=10001,gid=10001
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [agent_mcp, agent_egress]

  egress-proxy:
    image: ${DIFFUSE_IMAGE:-diffuse:local}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["egress-proxy"]
    healthcheck:
      test: ["CMD", "diffuse", "egress-proxy-healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 10
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [agent_egress, proxy_external]

volumes:
  pgdata:
  repository_data:
  agent_data:

networks:
  backend:
    internal: true
  agent_mcp:
    internal: true
  agent_egress:
    internal: true
  proxy_external:
    internal: false
  control_egress:
    internal: false
