# Verify — the gate every change passes before it can land.
#
# Naming convention shared with intuitumxyz/leo:
#   verify.yml   this file: runs on pull requests and on pushes to the default branch
#   release.yml  tag-driven publish
# Job ids are verb-led kebab-case so the checks list reads as a sequence of actions.
#
# Replaces ci.yml. Logic is ported unchanged except where noted; the container build now
# uses buildx with a GitHub Actions cache, which is the one place repeat runs were paying
# full price for an unchanged image.
#
# EVERY `uses:` IS PINNED TO A FULL COMMIT SHA, with the tag it resolved from in a
# trailing comment. See the same note in release.yml for why, and for how to refresh
# a pin. Pinning here as well as there is deliberate: this workflow runs on
# `pull_request`, so an attacker who can move an upstream tag would otherwise get code
# execution on every contributor's branch as well as on the default branch.
name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR #8 merged into a feature branch that `main` had already left behind,
  # stranding two Urgent security fixes for a day without anything failing.
  # A pull request must target the default branch unless it is deliberately
  # stacked on another `claude/` branch, which is a reviewed, temporary state.
  guard-base-branch:
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Refuse a pull request aimed away from the default branch
        env:
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BASE_REF" = "$DEFAULT_BRANCH" ]; then
            echo "Base branch is $BASE_REF."
            exit 0
          fi
          case "$BASE_REF" in
            claude/*)
              echo "::notice::Stacked on $BASE_REF. Retarget to $DEFAULT_BRANCH before merging, or merge the parent first."
              exit 0
              ;;
          esac
          echo "::error::This pull request targets '$BASE_REF', not '$DEFAULT_BRANCH'." >&2
          echo "Merging here can strand the change on a branch that $DEFAULT_BRANCH has already moved past." >&2
          echo "Retarget the pull request, or name the base 'claude/<feature>' if the stack is intentional." >&2
          exit 1

  lint-and-unit:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock
            requirements-build.txt
            requirements-build.lock
      # CHANGED: install requirements.lock FIRST, with --require-hashes, so the runtime
      # dependency set under test is byte-for-byte the set the image ships. This job
      # used to install requirements-dev.txt, which pulls in requirements.txt's version
      # RANGES and resolves them fresh on every run; the image installs the locks. The
      # two were never compared, so the tested dependency set was never the shipped one.
      # requirements-dev.txt is still installed afterwards, but only adds test tooling:
      # every runtime requirement it names is already satisfied at the locked version.
      - name: Install the locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Validate dependencies
        run: python -m pip check
      # Guards the step above: if requirements-dev.txt (or a range in requirements.txt)
      # ever drags a runtime dependency off its locked version, the suite would go back
      # to testing something the image does not contain. Deterministic - it compares two
      # local facts and never resolves anything - so it cannot fail for an unrelated
      # upstream release.
      - name: Confirm the tested dependency set is the shipped one
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import re
          import sys

          drift, missing, checked = [], [], 0
          with open("requirements.lock") as handle:
              for line in handle:
                  match = re.match(r"^([A-Za-z0-9][A-Za-z0-9._-]*)==([^\s;\\]+)", line)
                  if not match:
                      continue
                  name, pinned = match.group(1), match.group(2)
                  checked += 1
                  try:
                      installed = metadata.version(name)
                  except metadata.PackageNotFoundError:
                      missing.append(f"{name}=={pinned}")
                      continue
                  if installed != pinned:
                      drift.append(f"{name}: locked {pinned}, installed {installed}")

          print(f"checked {checked} locked requirements")
          if missing:
              print("NOT INSTALLED:\n  " + "\n  ".join(missing), file=sys.stderr)
          if drift:
              print("VERSION DRIFT:\n  " + "\n  ".join(drift), file=sys.stderr)
          sys.exit(1 if (missing or drift) else 0)
          PY
      # NOTE: this runs in the merge gate, so a new advisory against any transitive
      # dependency fails every open pull request until someone re-locks. That is a
      # deliberate trade for a proprietary self-hosted product, but it is the reason a
      # green branch can go red without a code change. Re-lock, do not skip.
      - name: Audit locked runtime dependencies
        run: python -m pip_audit -r requirements.lock --disable-pip
      - name: Lint
        run: python -m ruff check .
      - name: Run unit tests
        run: python -m pytest -m "not integration"

  test-postgres:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: diffuse
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: diffuse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diffuse -d diffuse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql://diffuse:integration-test@127.0.0.1:5432/diffuse_test
      # Without this the job is decorative. `pytest -m integration` with
      # POSTGRES_TEST_DATABASE_URL unset reported "40 skipped, 680 deselected" and
      # exit 0 - a rename of the variable above, or a service container that never
      # bound its port, was a green check. This makes tests/integration/conftest.py
      # treat a missing database, and a run that executes zero integration tests, as
      # errors rather than skips. See DEV-238.
      DIFFUSE_REQUIRE_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock
      # Same ordering as lint-and-unit: the shipped, locked set first.
      - name: Install the locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Migrate disposable database
        run: DATABASE_URL="$POSTGRES_TEST_DATABASE_URL" diffuse database migrate
      - name: Run PostgreSQL integration tests
        run: python -m pytest -m integration

  build-container:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # 30 -> 40: this job now boots the stack as well as building it, which adds a
    # PostgreSQL image pull plus the healthcheck waits.
    timeout-minutes: 40
    env:
      POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef
      DIFFUSE_API_TOKEN: 0123456789abcdef0123456789abcdef
      DIFFUSE_PUBLIC_URL: http://localhost:8000
      # Never used to call a provider: the worker boots against an empty queue and
      # idles. It is here because the worker validates its embedding credential at
      # startup -- a repository cannot be indexed without one, and a repository with
      # no index cannot be reviewed -- so an unset key is now a refusal to start
      # rather than a per-job failure. Without this the smoke test boots a worker
      # that immediately exits, which is exactly what it exists to catch.
      OPENAI_API_KEY: sk-ci-smoke-test-not-a-real-key
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          DIFFUSE_ENV_FILE=env.example DIFFUSE_IMAGE=diffuse:test \
            docker compose --env-file deploy/env.example \
              --file deploy/compose.yaml config --quiet

      # ADDED: buildx + a GitHub Actions layer cache. The old step ran a bare `docker build`
      # on every run, so an unchanged Dockerfile still rebuilt every layer from scratch.
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@6ff44f8e5255f9d8aa31ef22f7e57a2d926b7da0 # v1.11.0

      - name: Build production image
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2.2.0
        with:
          context: .
          load: true
          tags: diffuse:test

      - name: Validate packaged runtime
        run: |
          docker run --rm --entrypoint diffuse diffuse:test database --help
          docker run --rm --entrypoint diffuse diffuse:test worker --help
          docker run --rm --entrypoint /bin/sh diffuse:test -c '
            test "$(id -u)" -ne 0
            test ! -e /usr/local/bin/python
            test -x /opt/diffuse/diffuse
            test -x /opt/diffuse/_internal/service/git_askpass.sh
            test -f /opt/diffuse/_internal/sql/schema.sql
            test -f /opt/diffuse/_internal/evals/baseline.example.json
            ! find /opt/diffuse -type f \
              \( -name "*.py" -o -name "*.pyc" -o -name "*.pyo" \) \
              -print -quit | grep -q .
          '
          # `diffuse evaluate` is documented but evals/ was not packaged, so the
          # documented command had no file to point at inside the image. Run it with
          # the DEFAULT thresholds only: the committed fixture records a 0%-recall
          # run, so it correctly exits 1 under the thresholds in evals/README.md.
          # Gating on that exit code here would only invite someone to weaken a
          # quality gate to make a packaging check pass.
          docker run --rm --entrypoint diffuse diffuse:test \
            evaluate /opt/diffuse/_internal/evals/baseline.example.json
          # Parser distribution metadata must ship, or INDEX_FORMAT_VERSION
          # stops tracking grammar upgrades and stale indexes survive an
          # upgrade. See indexer/index_version.py.
          docker run --rm --entrypoint /bin/sh diffuse:test -c '
            for dist in tree_sitter tree_sitter_c tree_sitter_cpp tree_sitter_go \
                tree_sitter_java tree_sitter_javascript tree_sitter_php \
                tree_sitter_ruby tree_sitter_rust tree_sitter_typescript; do
              ls -d /opt/diffuse/_internal/"${dist}"-*.dist-info >/dev/null 2>&1 \
                || { echo "missing parser metadata: ${dist}" >&2; exit 1; }
            done
          '

      # ADDED: actually start the stack. Everything above this line is a parse check
      # or a single `docker run`, so until now nothing in .github/ ever brought the
      # image up. Two consequences, both of which shipped to customers unexercised:
      #
      #   * `read_only: true`, `cap_drop: [ALL]` and `no-new-privileges:true` on
      #     migrate/app/worker were never applied to a running process. docker-compose.yml
      #     says in a comment that the dev profile mirrors these "or a write-to-rootfs
      #     bug ships undetected because it only fails on their machine" - that
      #     mitigation had nothing enforcing it.
      #   * the migration path was only covered by the editable source install, where
      #     DIFFUSE_SQL_DIR is unset. The image sets it to /opt/diffuse/_internal/sql,
      #     which is a different branch in service/database_migrations.py.
      #
      # deploy/compose.yaml is used rather than docker-compose.yml on purpose: it is
      # the file customers run. deploy/env.example is used as shipped apart from the
      # four values it ships empty that something now refuses to start without, and
      # the image/secrets paths, so the customer env file is proven to boot rather
      # than merely proven to parse. Keep that substitution list in step with what
      # startup validation actually requires: a value missing here does not fail to
      # parse, it boots a container that exits.
      - name: Boot the customer stack against the built image
        working-directory: deploy
        run: |
          sed -e "s|^DIFFUSE_IMAGE=.*|DIFFUSE_IMAGE=diffuse:test|" \
              -e "s|^DIFFUSE_ENV_FILE=.*|DIFFUSE_ENV_FILE=ci.env|" \
              -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${POSTGRES_PASSWORD}|" \
              -e "s|^DIFFUSE_API_TOKEN=.*|DIFFUSE_API_TOKEN=${DIFFUSE_API_TOKEN}|" \
              -e "s|^DIFFUSE_PUBLIC_URL=.*|DIFFUSE_PUBLIC_URL=${DIFFUSE_PUBLIC_URL}|" \
              -e "s|^OPENAI_API_KEY=.*|OPENAI_API_KEY=${OPENAI_API_KEY}|" \
              env.example > ci.env

          # --wait blocks on the healthchecks. migrate is gated on db, and app on
          # migrate completing successfully, so a failure here means the release
          # ordering itself is broken - not just that one container is unhappy.
          # Scoped to db and app because --wait fails outright on a service with no
          # healthcheck, and the worker deliberately has none: it drains a queue
          # rather than serving a port, so process liveness would say nothing about
          # whether it is making progress. See DEV-227.
          docker compose --env-file ci.env --file compose.yaml --project-name diffuse-ci \
            up --detach --wait --wait-timeout 240 db app

          # The worker still has to boot. It validates its entire configuration at
          # startup now, so an exit here is a real packaging or configuration
          # regression rather than a slow start.
          docker compose --env-file ci.env --file compose.yaml --project-name diffuse-ci \
            up --detach worker
          sleep 10
          worker_state="$(docker compose --env-file ci.env --file compose.yaml \
            --project-name diffuse-ci ps --format '{{.State}}' worker)"
          if [ "$worker_state" != "running" ]; then
            echo "::error::worker is '${worker_state}', expected 'running'" >&2
            docker compose --env-file ci.env --file compose.yaml \
              --project-name diffuse-ci logs worker >&2
            exit 1
          fi

          # The exact check deploy/README.md tells a customer to run after `up -d`.
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/ready

          # docs/deployment.md requires this on every upgrade. It compares the applied
          # migration history against the SQL packaged in the image, which is the path
          # DIFFUSE_SQL_DIR selects and the source install never takes.
          docker compose --env-file ci.env --file compose.yaml --project-name diffuse-ci \
            run --rm --no-deps migrate database verify

          # Prove the hardening is in effect rather than merely parsed. A writable
          # rootfs here means read_only: true silently stopped applying.
          docker compose --env-file ci.env --file compose.yaml --project-name diffuse-ci \
            exec -T app /bin/sh -c '
              if touch /opt/diffuse/rootfs-canary 2>/dev/null; then
                echo "app rootfs is writable: read_only: true is not in effect" >&2
                exit 1
              fi
            '

      - name: Collect stack logs
        if: always()
        working-directory: deploy
        run: |
          test -f ci.env || exit 0
          docker compose --env-file ci.env --file compose.yaml --project-name diffuse-ci \
            logs --no-color --timestamps || true

      - name: Tear down the stack
        if: always()
        working-directory: deploy
        run: |
          if [ -f ci.env ]; then
            docker compose --env-file ci.env --file compose.yaml --project-name diffuse-ci \
              down --volumes --remove-orphans || true
          fi
          rm -f ci.env
