name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_IMAGE: diffuse-tests:ci-${{ github.run_id }}-${{ github.run_attempt }}
  APP_IMAGE: diffuse:ci-${{ github.run_id }}-${{ github.run_attempt }}
  CLAUDE_IMAGE: diffuse-runner-claude:ci-${{ github.run_id }}-${{ github.run_attempt }}
  CODEX_IMAGE: diffuse-runner-codex:ci-${{ github.run_id }}-${{ github.run_attempt }}
  TEST_PROJECT: diffuse-tests-${{ github.run_id }}-${{ github.run_attempt }}
  DEPLOY_PROJECT: diffuse-ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  check:
    runs-on: intuitum-4vcpu-ubuntu-2604
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Check
        run: |
          python -m pip check
          python -m pip freeze > /tmp/installed.txt
          python scripts/check_lock_freeze.py /tmp/installed.txt requirements.lock
          python -m pip_audit -r requirements.lock --disable-pip
          python -m ruff check .
          git diff --check

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks

      - name: Scan secrets
        run: |
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner

  test:
    needs: check
    runs-on: intuitum-8vcpu-ubuntu-2604
    timeout-minutes: 45
    env:
      POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef
      DIFFUSE_PUBLIC_URL: http://localhost:8000
      DIFFUSE_REVIEW_AGENT_DISPATCH_PUBLIC_KEY: Yfs8wlT_0BUOdJOjbOpcJ2khTWvDZi4y-K8XZOVxeFE
      DIFFUSE_REVIEW_AGENT_TRANSPORT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      REVIEW_AGENT: codex
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup BuildKit
        run: |
          docker buildx inspect diffuse >/dev/null 2>&1 \
            || docker buildx create --name diffuse --driver docker-container \
            || docker buildx inspect diffuse >/dev/null

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: diffuse
          context: .
          target: test-runner
          load: true
          tags: ${{ env.TEST_IMAGE }}

      - name: Test
        run: |
          docker run --rm --entrypoint pip "$TEST_IMAGE" freeze > /tmp/installed.txt
          python3 scripts/check_lock_freeze.py /tmp/installed.txt requirements.lock
          DIFFUSE_TEST_IMAGE="$TEST_IMAGE" docker compose \
            --project-name "$TEST_PROJECT" \
            --file compose.tests.yaml \
            run --rm tests
          docker compose --project-name "$TEST_PROJECT" \
            --file compose.tests.yaml down --volumes --remove-orphans

      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          DIFFUSE_ENV_FILE=env.example DIFFUSE_IMAGE="$APP_IMAGE" \
            docker compose --env-file deploy/env.example \
              --file deploy/compose.yaml config --quiet

      - name: Build application image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: diffuse
          context: .
          load: true
          tags: ${{ env.APP_IMAGE }}

      - name: Build Agent Host images
        run: |
          docker buildx build --builder diffuse --load --target runner-claude \
            --tag "$CLAUDE_IMAGE" .
          docker buildx build --builder diffuse --load --target runner-codex \
            --tag "$CODEX_IMAGE" .

      - name: Validate images
        run: |
          docker run --rm --entrypoint diffuse "$APP_IMAGE" database --help
          docker run --rm --entrypoint diffuse "$APP_IMAGE" worker --help
          docker run --rm --entrypoint /bin/sh "$APP_IMAGE" -c '
            test "$(id -u)" -ne 0
            test ! -e /usr/local/bin/python
            test -x /opt/diffuse/diffuse
            test -x /opt/diffuse/_internal/diffuse/repository/git_askpass.sh
            test -f /opt/diffuse/_internal/sql/schema.sql
            ! find /opt/diffuse -type f \
              \( -name "*.py" -o -name "*.pyc" -o -name "*.pyo" \) \
              -print -quit | grep -q .
          '
          docker run --rm --entrypoint /bin/sh "$CLAUDE_IMAGE" -c '
            test "$(id -u)" = 10001
            test ! -e /usr/local/bin/codex
            claude --version
          '
          docker run --rm --entrypoint /bin/sh "$CODEX_IMAGE" -c '
            test "$(id -u)" = 10001
            test ! -e /usr/local/bin/claude
            codex --version
          '

      - name: Smoke test deployment
        working-directory: deploy
        run: |
          sed -e "s|^DIFFUSE_IMAGE=.*|DIFFUSE_IMAGE=${APP_IMAGE}|" \
              -e "s|^DIFFUSE_CLAUDE_RUNNER_IMAGE=.*|DIFFUSE_CLAUDE_RUNNER_IMAGE=${CLAUDE_IMAGE}|" \
              -e "s|^DIFFUSE_CODEX_RUNNER_IMAGE=.*|DIFFUSE_CODEX_RUNNER_IMAGE=${CODEX_IMAGE}|" \
              -e "s|^DIFFUSE_ENV_FILE=.*|DIFFUSE_ENV_FILE=ci.env|" \
              -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${POSTGRES_PASSWORD}|" \
              -e "s|^DIFFUSE_PUBLIC_URL=.*|DIFFUSE_PUBLIC_URL=${DIFFUSE_PUBLIC_URL}|" \
              -e "s|^DIFFUSE_GITHUB_INTEGRATION_URL=.*|DIFFUSE_GITHUB_INTEGRATION_URL=|" \
              -e "s|^DIFFUSE_GITHUB_INTEGRATION_TOKEN=.*|DIFFUSE_GITHUB_INTEGRATION_TOKEN=|" \
              env.example > ci.env
          {
            printf 'DIFFUSE_REVIEW_AGENT_CAPABILITY_SIGNING_KEY=%s\n' \
              "$(openssl rand -hex 48)"
            printf 'DIFFUSE_REVIEW_AGENT_TRANSPORT_SECRET=%s\n' \
              "$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')"
            printf 'DIFFUSE_REVIEW_AGENT_DISPATCH_PRIVATE_KEY=%s\n' \
              "$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')"
            printf '%s\n' 'DIFFUSE_DB_HOST_PORT=0' 'DIFFUSE_APP_HOST_PORT=0'
          } >> ci.env

          compose=(docker compose --env-file ci.env --file compose.yaml \
            --project-name "$DEPLOY_PROJECT")
          "${compose[@]}" up --detach --wait --wait-timeout 240 db app
          "${compose[@]}" up --detach worker

          worker_state=""
          for _ in $(seq 1 10); do
            worker_state="$("${compose[@]}" ps --format '{{.State}}' worker)"
            [ "$worker_state" = running ] && break
            sleep 1
          done
          [ "$worker_state" = running ] || {
            "${compose[@]}" logs worker >&2
            exit 1
          }

          app_port="$("${compose[@]}" port app 8000 | sed 's/.*://')"
          test -n "$app_port"
          curl --fail --silent --show-error --max-time 10 \
            "http://127.0.0.1:${app_port}/ready"
          "${compose[@]}" run --rm --no-deps migrate database verify
          "${compose[@]}" exec -T app /bin/sh -c \
            '! touch /opt/diffuse/rootfs-canary 2>/dev/null'

          # Expanded by the Agent Host container, not this shell.
          # shellcheck disable=SC2016
          credential_check='set -eu
            test "$(id -u):$(id -g)" = "10001:10001"
            test "$(stat -c "%u:%g:%a" /var/lib/diffuse/agent)" = "10001:10001:700"
            test -w /var/lib/diffuse/agent
            test "$HOME" = /var/lib/diffuse/agent/home
            test -d "$HOME" && test -w "$HOME"'
          for runner in claude codex; do
            "${compose[@]}" --profile "agent-${runner}" run --rm --no-deps \
              --entrypoint /bin/sh "agent-host-${runner}" -c "$credential_check"
            # Each profile adds two private networks. Release them before the
            # next profile so shared CI daemons do not exhaust Docker's pools.
            docker network rm \
              "${DEPLOY_PROJECT}_agent_mcp_${runner}" \
              "${DEPLOY_PROJECT}_agent_egress_${runner}"
          done

      - name: Logs
        if: failure()
        working-directory: deploy
        run: |
          test -f ci.env || exit 0
          docker compose --env-file ci.env --file compose.yaml \
            --project-name "$DEPLOY_PROJECT" logs --no-color --timestamps || true

      - name: Cleanup
        if: always()
        run: |
          docker compose --project-name "$TEST_PROJECT" \
            --file compose.tests.yaml down --volumes --remove-orphans || true
          if [ -f deploy/ci.env ]; then
            docker compose --env-file deploy/ci.env --file deploy/compose.yaml \
              --project-name "$DEPLOY_PROJECT" down --volumes --remove-orphans || true
          fi
          rm -f .env deploy/ci.env
          docker image rm "$TEST_IMAGE" "$APP_IMAGE" "$CLAUDE_IMAGE" "$CODEX_IMAGE" \
            >/dev/null 2>&1 || true
