name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-dev-tools.txt
            requirements.lock
      # Tests must exercise the dependency set the Dockerfile installs, so the
      # hash-pinned lock is installed last: anything a dev tool dragged in is
      # overwritten by the pinned version, and `pip check` afterwards proves the
      # tools still work against it. Installing requirements-dev.txt instead
      # would re-resolve requirements.txt and green CI would say nothing about
      # what production runs.
      - name: Install locked runtime and development dependencies
        run: |
          python -m pip install -r requirements-dev-tools.txt
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Validate dependencies
        run: python -m pip check
      - name: Audit locked runtime dependencies
        run: python -m pip_audit -r requirements.lock --disable-pip
      - name: Lint
        run: python -m ruff check .
      - name: Run unit tests
        run: python -m pytest -m "not integration"

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: diffuse
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: diffuse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diffuse -d diffuse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql://diffuse:integration-test@127.0.0.1:5432/diffuse_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-dev-tools.txt
            requirements.lock
      # Tests must exercise the dependency set the Dockerfile installs, so the
      # hash-pinned lock is installed last: anything a dev tool dragged in is
      # overwritten by the pinned version, and `pip check` afterwards proves the
      # tools still work against it. Installing requirements-dev.txt instead
      # would re-resolve requirements.txt and green CI would say nothing about
      # what production runs.
      - name: Install locked runtime and development dependencies
        run: |
          python -m pip install -r requirements-dev-tools.txt
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Migrate disposable database
        run: DATABASE_URL="$POSTGRES_TEST_DATABASE_URL" diffuse database migrate
      - name: Run PostgreSQL integration tests
        run: python -m pytest -m integration

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef
      DIFFUSE_API_TOKEN: 0123456789abcdef0123456789abcdef
      DIFFUSE_PUBLIC_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build production image
        run: docker build --tag diffuse:test .
