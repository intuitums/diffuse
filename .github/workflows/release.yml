# Release — tag-driven publish of a signed, immutable multi-arch image plus the
# self-host deployment bundle.
#
# Naming convention shared with intuitumxyz/leo: ci.yml gates changes, release.yml
# publishes them.
#
# STRUCTURE CHANGED for Blacksmith. The previous single job built linux/amd64 and
# linux/arm64 together on one amd64 runner, so the arm64 leg ran under QEMU emulation -
# that is where most of the measured 28m20s went. Blacksmith has native arm64 runners, so
# each architecture now builds on its own machine in parallel and the two are merged into
# one manifest afterwards. This is the pattern Blacksmith's docs prescribe; they note a
# future `platforms` input will do it natively, at which point this collapses back.
#
# UNCHANGED and load-bearing - do not simplify these away:
#   * semver validation and the check that the tag descends from main
#   * cosign signing of the DIGEST, not a tag
#   * SBOM and provenance mode=max
#   * the digest-pinned self-host bundle and its sha256
#
# EVERY `uses:` IS PINNED TO A FULL COMMIT SHA, with the tag it resolved from in a
# trailing comment. Do not "tidy" these back into tags. A version tag is a mutable
# pointer the action's owner can move at any time; `publish` holds `id-token: write`
# and runs third-party actions BEFORE `cosign sign`, so a retagged upstream action
# would get code execution in the exact job that mints the Fulcio certificate - and
# the signature it produced would verify cleanly against the identity regexp we
# publish to operators. Refresh a pin by resolving the tag with
# `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` and updating both the SHA and
# the comment together.
#
# DISTRIBUTION. The bundle used to exist only as an Actions artifact with a 30-day
# retention, which is not a distribution channel: it needs repository access to
# fetch, and on day 31 the only thing binding a release to its pinned
# DIFFUSE_IMAGE digest is deleted. It now goes to two durable places, see
# `distribute` below.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release mid-publish: a half-pushed manifest is worse than a queued one.
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/intuitumxyz/diffuse
  CLAUDE_RUNNER_IMAGE: ghcr.io/intuitumxyz/diffuse-runner-claude
  CODEX_RUNNER_IMAGE: ghcr.io/intuitumxyz/diffuse-runner-codex
  # The self-host bundle is published as a public OCI artifact next to the image.
  # GHCR package visibility is configured outside Actions. The anonymous-access
  # gate below fails the release if either package is not actually public.
  BUNDLE_ARTIFACT: ghcr.io/intuitumxyz/diffuse-self-host

jobs:
  # Split out so a bad tag fails in seconds instead of after two image builds.
  validate-tag:
    runs-on: intuitum-2vcpu-ubuntu-2604
    timeout-minutes: 10
    outputs:
      created: ${{ steps.build-time.outputs.created }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0   # the ancestry check below needs full history

      # A tag that does not descend from main would publish an image built from code that
      # was never reviewed on the default branch.
      - name: Validate release tag
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must be semantic versions such as v1.2.3" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "Release tags must point to a commit on main" >&2
            exit 1
          fi

      # Shared by both arch builds so the two images carry an identical created label.
      - name: Record build time
        id: build-time
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  # One native machine per architecture, in parallel. Each builds the app and both
  # runner targets, pushes them by digest only (no tags), and hands all three sets
  # of digests to `publish` for registry-side manifest assembly.
  build:
    needs: validate-tag
    strategy:
      fail-fast: true
      matrix:
        include:
          # amd64 builds on the self-hosted runner build-container uses — the label
          # maps to exactly one runner, whose rootless daemon holds the persistent
          # `diffuse` builder — so it starts from the layers the merge's own CI
          # run just proved, locally, with no cache import leg at all. See
          # build-container for the measurements that retired the GitHub Actions
          # cache on the box.
          - platform: linux/amd64
            architecture: amd64
            runner: intuitum-8vcpu-ubuntu-2604
            builder: diffuse
            app_cache_from: ""
            app_cache_to: ""
            claude_cache_from: ""
            claude_cache_to: ""
            codex_cache_from: ""
            codex_cache_to: ""
          # arm64 STAYS on Blacksmith, and this is the only thing still holding that
          # account open. intuitumserver-1 is x86_64 with no qemu handlers registered;
          # the expensive step in this Dockerfile is PyInstaller, which cannot
          # cross-compile and has to execute on the target architecture, so emulating it
          # would turn a 45-minute build into hours. Moving this leg needs native arm64
          # hardware, not a config change.
          #
          # This leg also KEEPS the GitHub Actions cache: Blacksmith's runners are
          # ephemeral VMs in Blacksmith's datacenter, so there is no persistent daemon
          # to adopt a builder from, and its path to the cache service is not the
          # self-hosted upload leg that made `type=gha` untenable on the box. Its own
          # scope, because a GitHub Actions cache scope is not partitioned by
          # architecture and an amd64 export would poison an arm64 restore.
          - platform: linux/arm64
            architecture: arm64
            runner: blacksmith-8vcpu-ubuntu-2404-arm
            builder: ""
            app_cache_from: type=gha,scope=diffuse/Dockerfile-arm64
            app_cache_to: type=gha,scope=diffuse/Dockerfile-arm64,mode=max
            claude_cache_from: type=gha,scope=diffuse/Dockerfile-runner-claude-arm64
            claude_cache_to: type=gha,scope=diffuse/Dockerfile-runner-claude-arm64,mode=max
            codex_cache_from: type=gha,scope=diffuse/Dockerfile-runner-codex-arm64
            codex_cache_to: type=gha,scope=diffuse/Dockerfile-runner-codex-arm64,mode=max
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Sign in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 adopts its runner's persistent builder — the same idempotent command as
      # ci.yml's container jobs; keep the two spellings identical. arm64 is on an
      # ephemeral Blacksmith VM, so it provisions a throwaway buildx the ordinary way
      # and leans on the `type=gha` cache declared in the matrix. Attestations below
      # (`sbom`, `provenance`) need the docker-container driver on both paths; the
      # persistent builder was created with it, and setup-buildx-action defaults to it.
      - name: Use the persistent builder
        if: matrix.builder != ''
        run: |
          docker buildx inspect diffuse >/dev/null 2>&1 \
            || docker buildx create --name diffuse --driver docker-container \
            || docker buildx inspect diffuse >/dev/null

      - name: Set up Buildx
        if: matrix.builder == ''
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Empty builder/cache inputs are treated as unset. The amd64 leg therefore
      # adopts the persistent builder without exporting it, while arm64 gives each
      # final target its own cache scope so one target cannot overwrite another's.
      - name: Build and push app by digest
        id: app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: ${{ matrix.builder }}
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: ${{ matrix.app_cache_from }}
          cache-to: ${{ matrix.app_cache_to }}
          build-args: |
            DIFFUSE_VERSION=${{ github.ref_name }}
            DIFFUSE_REVISION=${{ github.sha }}
            DIFFUSE_CREATED=${{ needs.validate-tag.outputs.created }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # Build runners on the same native architecture as the app. Their Dockerfile
      # stages execute the architecture-specific CLI binaries, so moving arm64 back
      # into the x86 publish job would require emulation and invalidate this check.
      - name: Build and push Claude runner by digest
        id: claude
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: ${{ matrix.builder }}
          context: .
          target: runner-claude
          platforms: ${{ matrix.platform }}
          cache-from: ${{ matrix.claude_cache_from }}
          cache-to: ${{ matrix.claude_cache_to }}
          build-args: |
            DIFFUSE_VERSION=${{ github.ref_name }}
            DIFFUSE_REVISION=${{ github.sha }}
            DIFFUSE_CREATED=${{ needs.validate-tag.outputs.created }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.CLAUDE_RUNNER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push Codex runner by digest
        id: codex
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: ${{ matrix.builder }}
          context: .
          target: runner-codex
          platforms: ${{ matrix.platform }}
          cache-from: ${{ matrix.codex_cache_from }}
          cache-to: ${{ matrix.codex_cache_to }}
          build-args: |
            DIFFUSE_VERSION=${{ github.ref_name }}
            DIFFUSE_REVISION=${{ github.sha }}
            DIFFUSE_CREATED=${{ needs.validate-tag.outputs.created }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.CODEX_RUNNER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digests
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          CLAUDE_DIGEST: ${{ steps.claude.outputs.digest }}
          CODEX_DIGEST: ${{ steps.codex.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/app-${{ matrix.architecture }}-${APP_DIGEST#sha256:}"
          touch "/tmp/digests/claude-${{ matrix.architecture }}-${CLAUDE_DIGEST#sha256:}"
          touch "/tmp/digests/codex-${{ matrix.architecture }}-${CODEX_DIGEST#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [validate-tag, build]
    runs-on: intuitum-2vcpu-ubuntu-2604
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      claude_runner_digest: ${{ steps.runner-manifests.outputs.claude_digest }}
      codex_runner_digest: ${{ steps.runner-manifests.outputs.codex_digest }}
    permissions:
      contents: read
      id-token: write   # keyless cosign signing
      packages: write
      # Deliberately NOT contents: write. Creating the GitHub Release needs it, and
      # this is the job that holds id-token: write. Keeping the two capabilities in
      # separate jobs means no single compromised step can both mint a Diffuse
      # release identity and write to the repository. See `distribute`.
    steps:
      # Needed for deploy/ and docs/ in the bundle.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download digests
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Sign in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This job builds nothing: all image work below is registry-side manifest
      # assembly, so it declares no cache and needs no target architecture support.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Assemble exactly one digest from each native architecture into the app manifest.
      - name: Create multi-arch app manifest
        working-directory: /tmp/digests
        run: |
          for architecture in amd64 arm64; do
            files=(app-"${architecture}"-*)
            if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
              echo "expected one app digest for ${architecture}" >&2
              exit 1
            fi
          done
          mapfile -t tags < <(jq -r '.tags[]' <<< '${{ steps.metadata.outputs.json }}')
          tag_arguments=()
          for tag in "${tags[@]}"; do
            tag_arguments+=(--tag "$tag")
          done
          sources=()
          for file in app-*-*; do
            sources+=("${IMAGE}@sha256:${file##*-}")
          done
          docker buildx imagetools create "${tag_arguments[@]}" "${sources[@]}"

      # Re-read the manifest digest: this is what gets signed and pinned into the bundle.
      - name: Resolve app manifest digest
        id: manifest
        run: |
          version=$(jq -r '.tags[0]' <<< '${{ steps.metadata.outputs.json }}')
          digest=$(docker buildx imagetools inspect "$version" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "App manifest digest: $digest"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signs the DIGEST, not a tag. Tags are mutable; the digest is what deploy.sh verifies.
      - name: Sign the app manifest
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Runner SBOM and provenance attestations were produced in the native build
      # jobs. Assemble and sign their release manifests without executing target code.
      - name: Create and sign runner manifests
        id: runner-manifests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: /tmp/digests
        run: |
          for runtime in claude codex; do
            image_var="${runtime^^}_RUNNER_IMAGE"
            image="${!image_var}"
            for architecture in amd64 arm64; do
              files=("${runtime}-${architecture}-"*)
              if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
                echo "expected one ${runtime} digest for ${architecture}" >&2
                exit 1
              fi
            done
            sources=()
            for file in "${runtime}"-*-*; do
              sources+=("${image}@sha256:${file##*-}")
            done
            docker buildx imagetools create \
              --tag "${image}:${RELEASE_TAG}" \
              "${sources[@]}"
            digest=$(docker buildx imagetools inspect "${image}:${RELEASE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
            cosign sign --yes "${image}@${digest}"
            echo "${runtime}_digest=${digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Build self-host deployment bundle
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          CLAUDE_DIGEST: ${{ steps.runner-manifests.outputs.claude_digest }}
          CODEX_DIGEST: ${{ steps.runner-manifests.outputs.codex_digest }}
        run: |
          mkdir -p release/diffuse
          cp LICENSE deploy/README.md deploy/compose.yaml deploy/env.example release/diffuse/
          sed -i "s|^DIFFUSE_IMAGE=.*|DIFFUSE_IMAGE=${IMAGE}@${DIGEST}|" \
            release/diffuse/env.example
          sed -i "s|^DIFFUSE_CLAUDE_RUNNER_IMAGE=.*|DIFFUSE_CLAUDE_RUNNER_IMAGE=${CLAUDE_RUNNER_IMAGE}@${CLAUDE_DIGEST}|" \
            release/diffuse/env.example
          sed -i "s|^DIFFUSE_CODEX_RUNNER_IMAGE=.*|DIFFUSE_CODEX_RUNNER_IMAGE=${CODEX_RUNNER_IMAGE}@${CODEX_DIGEST}|" \
            release/diffuse/env.example
          cp docs/deployment.md release/diffuse/OPERATIONS.md
          # The per-repository policy reference. README.md and OPERATIONS.md both
          # send the reader here to change the trigger and status-check defaults,
          # so omitting it ships two dangling references and no way to act on them.
          cp docs/configuration.md release/diffuse/CONFIGURATION.md
          tar -C release -czf diffuse-self-host.tar.gz diffuse
          sha256sum diffuse-self-host.tar.gz > diffuse-self-host.tar.gz.sha256

      # Job-to-job handoff ONLY - not a distribution channel. `distribute` republishes
      # this to the two places operators can actually fetch it from, so
      # the retention here is deliberately one day.
      - name: Hand the bundle to the distribute job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diffuse-self-host-${{ github.run_id }}
          path: |
            diffuse-self-host.tar.gz
            diffuse-self-host.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  # Where the self-host bundle actually becomes retrievable. Split out of `publish`
  # for permission separation: this job needs `contents: write` to cut a Release,
  # and GitHub has no narrower scope for that, so it must not also hold
  # `id-token: write`. It holds neither an OIDC identity nor any signing key.
  #
  # Two public channels, because they serve different readers:
  #
  #   1. OCI artifact at $BUNDLE_ARTIFACT. This is the machine-readable,
  #      anonymously pullable channel for deployment automation.
  #
  #   2. GitHub Release on this public repository. This is the human-readable record:
  #      it makes `vX.Y.Z -> pinned digest -> bundle sha256` durably greppable years
  #      later without needing a registry client.
  distribute:
    needs: [publish]
    runs-on: intuitum-2vcpu-ubuntu-2604
    timeout-minutes: 20
    permissions:
      contents: write   # the only reason this job exists as a separate job
      packages: write   # push the bundle artifact next to the image
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      CLAUDE_DIGEST: ${{ needs.publish.outputs.claude_runner_digest }}
      CODEX_DIGEST: ${{ needs.publish.outputs.codex_runner_digest }}
    steps:
      - name: Collect the bundle
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: diffuse-self-host-${{ github.run_id }}

      # Refuse to publish a bundle that is not bound to all three resolved manifests.
      # Without this an upstream failure could leave a placeholder or empty runner pin.
      - name: Require resolved digests
        run: |
          for name in DIGEST CLAUDE_DIGEST CODEX_DIGEST; do
            value="${!name}"
            if [[ ! "$value" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "publish did not produce ${name} (got '${value}')" >&2
              exit 1
            fi
          done
          sha256sum --check diffuse-self-host.tar.gz.sha256

      # Installed from the vendor tarball rather than an action, pinned by version AND
      # by the sha256 the ORAS project publishes in oras_<version>_checksums.txt. One
      # fewer third-party action in a job that can write to this repository.
      - name: Install ORAS
        env:
          ORAS_VERSION: "1.3.3"
          ORAS_SHA256: 9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59
        run: |
          curl --fail --silent --show-error --location \
            --output oras.tar.gz \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  oras.tar.gz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/oras"
          tar -C "${RUNNER_TEMP}/oras" -xzf oras.tar.gz oras
          rm oras.tar.gz
          echo "${RUNNER_TEMP}/oras" >> "$GITHUB_PATH"

      # CHANNEL 1 - OCI. Annotations carry the image digest the bundle pins, so
      # the binding survives even if the tarball is unpacked and the env.example edited.
      - name: Publish the bundle as an OCI artifact
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" \
            | oras login ghcr.io --username "$REGISTRY_USER" --password-stdin
          oras push \
            --artifact-type application/vnd.diffuse.self-host.bundle.v1 \
            --annotation "org.opencontainers.image.version=${RELEASE_TAG}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "xyz.intuitum.diffuse.image=${IMAGE}@${DIGEST}" \
            --annotation "xyz.intuitum.diffuse.runner.claude=${CLAUDE_RUNNER_IMAGE}@${CLAUDE_DIGEST}" \
            --annotation "xyz.intuitum.diffuse.runner.codex=${CODEX_RUNNER_IMAGE}@${CODEX_DIGEST}" \
            "${BUNDLE_ARTIFACT}:${RELEASE_TAG}" \
            diffuse-self-host.tar.gz:application/gzip \
            diffuse-self-host.tar.gz.sha256:text/plain

      # Public GHCR packages can be pulled anonymously. GitHub creates new packages
      # private, and package visibility is an irreversible repository setting rather
      # than a workflow input. Fail before creating the GitHub Release if an
      # administrator has not made both packages public. The first bundle publish may
      # therefore need a re-run after its package is made public.
      - name: Verify anonymous release access
        run: |
          oras logout ghcr.io
          oras manifest fetch "${IMAGE}@${DIGEST}" >/dev/null
          oras manifest fetch "${CLAUDE_RUNNER_IMAGE}@${CLAUDE_DIGEST}" >/dev/null
          oras manifest fetch "${CODEX_RUNNER_IMAGE}@${CODEX_DIGEST}" >/dev/null
          oras manifest fetch "${BUNDLE_ARTIFACT}:${RELEASE_TAG}" >/dev/null

      # CHANNEL 2 - GitHub Release. Idempotent so a re-run of a release tag
      # repairs a partial publish instead of failing on "release already exists";
      # `concurrency: cancel-in-progress: false` means a re-run is a real scenario.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Self-hosted Diffuse release. The image is signed with cosign; verify it before running it."
            echo
            echo '```'
            echo "DIFFUSE_IMAGE=${IMAGE}@${DIGEST}"
            echo "DIFFUSE_CLAUDE_RUNNER_IMAGE=${CLAUDE_RUNNER_IMAGE}@${CLAUDE_DIGEST}"
            echo "DIFFUSE_CODEX_RUNNER_IMAGE=${CODEX_RUNNER_IMAGE}@${CODEX_DIGEST}"
            echo '```'
            echo
            echo "Self-host bundle sha256:"
            echo
            echo '```'
            cat diffuse-self-host.tar.gz.sha256
            echo '```'
            echo
            echo "The same bundle is anonymously pullable from GHCR:"
            echo
            echo '```'
            echo "oras pull ${BUNDLE_ARTIFACT}:${RELEASE_TAG}"
            echo '```'
          } > release-notes.md

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              diffuse-self-host.tar.gz diffuse-self-host.tar.gz.sha256
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --verify-tag \
              diffuse-self-host.tar.gz diffuse-self-host.tar.gz.sha256
          fi
