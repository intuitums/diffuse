# Release — tag-driven publish of a signed, immutable multi-arch image plus the
# customer self-host bundle.
#
# Naming convention shared with intuitumxyz/leo: verify.yml gates changes, release.yml
# publishes them. Display name shortened from "Release private image" to "Release" so the
# checks list reads consistently across repos.
#
# Logic ported unchanged from the previous release.yml except for the build cache, noted
# below. The tag-ancestry check, cosign signing, SBOM/provenance and digest-pinned bundle
# are all deliberate and load-bearing - do not simplify them away.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release mid-publish: a half-pushed multi-arch manifest is worse than
  # a queued one.
  cancel-in-progress: false

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write   # keyless cosign signing
      packages: write   # push to ghcr
    env:
      IMAGE: ghcr.io/intuitumxyz/diffuse
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # tag-ancestry check below needs full history

      # A tag that does not descend from main would publish an image built from code that
      # was never reviewed on the default branch.
      - name: Validate release tag
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must be semantic versions such as v1.2.3" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "Release tags must point to a commit on main" >&2
            exit 1
          fi

      - name: Record build time
        id: build-time
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Sign in to the private registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ADDED cache-from/cache-to. This job measured 28m20s, and the arm64 leg builds under
      # QEMU emulation, which is the bulk of it. A layer cache does not remove emulation
      # cost but does remove it for layers that have not changed between releases.
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            DIFFUSE_VERSION=${{ github.ref_name }}
            DIFFUSE_REVISION=${{ github.sha }}
            DIFFUSE_CREATED=${{ steps.build-time.outputs.created }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Signs the DIGEST, not a tag. Tags are mutable; the digest is what deploy.sh verifies.
      - name: Sign the published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Build customer deployment bundle
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release/diffuse
          cp deploy/README.md deploy/compose.yaml deploy/env.example release/diffuse/
          sed -i "s|^DIFFUSE_IMAGE=.*|DIFFUSE_IMAGE=${IMAGE}@${DIGEST}|" \
            release/diffuse/env.example
          cp docs/deployment.md release/diffuse/OPERATIONS.md
          tar -C release -czf diffuse-self-host.tar.gz diffuse
          sha256sum diffuse-self-host.tar.gz > diffuse-self-host.tar.gz.sha256

      - name: Retain customer deployment bundle
        uses: actions/upload-artifact@v7
        with:
          name: diffuse-self-host-${{ github.run_id }}
          path: |
            diffuse-self-host.tar.gz
            diffuse-self-host.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
