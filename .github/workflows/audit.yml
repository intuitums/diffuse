name: Audit

# Dependency advisories (pip-audit). Runs on the schedule, when the pinned
# dependency set changes, and on demand, so a CVE in an existing pin still
# surfaces without a PR.
on:
  schedule:
    - cron: "23 6 * * 1"
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - "requirements.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit
    runs-on: intuitum-4vcpu-ubuntu-2604
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Audit
        run: python -m pip_audit -r requirements.lock --disable-pip
