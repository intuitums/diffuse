name: diffuse

services:
  db:
    # Nothing in Diffuse uses pgvector any more: migration 0010 dropped the
    # embedding column and the extension. The image still ships it because
    # `sql/schema.sql` is the frozen version-1 migration and still runs
    # `CREATE EXTENSION IF NOT EXISTS vector` on a fresh install, which stock
    # `postgres:17` cannot satisfy. Swapping this is a one-line change once the
    # version-1 baseline is re-cut.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0}
    restart: unless-stopped
    environment:
      POSTGRES_USER: diffuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: diffuse
    # Docker's default /dev/shm is 64MB. PostgreSQL's parallel query workers
    # allocate dynamic shared memory there, and on a large snapshot a retrieval
    # query can fail with "could not resize shared memory segment". Raise this
    # further if a very large monorepo still hits that error.
    shm_size: 1gb
    # `db` is the only service not running with ALL capabilities dropped, because
    # the PostgreSQL entrypoint starts as root and needs CHOWN/SETUID/SETGID/FOWNER
    # /DAC_OVERRIDE to initialise the data directory and step down to the postgres
    # user. Those five are the whole set it needs; everything else goes.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffuse -d diffuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback-only, and overridable. The default is unchanged: one instance on one
    # machine gets 5432 where an operator expects it. DIFFUSE_DB_HOST_PORT exists for
    # hosts that already have something there - CI boots this stack on a box that also
    # runs Diffuse - where 0 asks the kernel for any free port.
    ports:
      - "127.0.0.1:${DIFFUSE_DB_HOST_PORT:-5432}:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 1m
    networks: [backend]

  migrate:
    image: ${DIFFUSE_IMAGE:?Set DIFFUSE_IMAGE to the release digest in .env}
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["database", "migrate"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
      DIFFUSE_AGENT_DISPATCH_PRIVATE_KEY: ""
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [backend]

  app:
    image: ${DIFFUSE_IMAGE:?Set DIFFUSE_IMAGE to the release digest in .env}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
      DIFFUSE_PUBLIC_URL: ${DIFFUSE_PUBLIC_URL:?Set DIFFUSE_PUBLIC_URL in .env}
      DIFFUSE_AGENT_DISPATCH_PRIVATE_KEY: ""
    # Overridable for the same reason as the database's, and with the same default:
    # a customer running one instance gets 8000 where deploy/README.md says it will be.
    ports:
      - "127.0.0.1:${DIFFUSE_APP_HOST_PORT:-8000}:8000"
    volumes:
      - repository_data:/var/lib/diffuse/repositories
    tmpfs:
      - /tmp:size=256m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    networks: [backend, control_egress]

  worker:
    image: ${DIFFUSE_IMAGE:?Set DIFFUSE_IMAGE to the release digest in .env}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
    volumes:
      - repository_data:/var/lib/diffuse/repositories
    tmpfs:
      - /tmp:size=512m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    networks: [backend, runner_control_claude, runner_control_codex, control_egress]

  # The hosted Diffuse-Agent service receives the shared App webhook. This
  # process pulls its installation-scoped events into the local durable queue,
  # so the customer exposes no inbound webhook and never receives the App key.
  relay:
    image: ${DIFFUSE_IMAGE:?Set DIFFUSE_IMAGE to the release digest in .env}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["relay"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
      GITHUB_APP_ID: ""
      GITHUB_APP_INSTALLATION_ID: ""
      GITHUB_APP_PRIVATE_KEY_FILE: ""
      GITHUB_APP_PRIVATE_KEY: ""
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    networks: [backend, control_egress]

  # Both independently packaged CLIs are deployed because a trusted PR can be
  # routed to the opposing family. Neither service has application credentials.
  agent-runner-claude:
    image: ${DIFFUSE_CLAUDE_RUNNER_IMAGE:?Set DIFFUSE_CLAUDE_RUNNER_IMAGE to the release digest in .env}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # `docker compose run … agent login` still overrides this daemon command for
    # operator sign-in.
    command: ["agent-runner"]
    profiles: ["agent-claude"]
    healthcheck:
      test: ["CMD", "diffuse", "agent-runner-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 6
    depends_on:
      egress-proxy-claude:
        condition: service_healthy
    environment:
      HOME: /var/lib/diffuse/agent/home
      DIFFUSE_AGENT_HOME: /var/lib/diffuse/agent
      DIFFUSE_AGENT_RUNTIME: claude
      DIFFUSE_AGENT_DISPATCH_PUBLIC_KEY: ${DIFFUSE_AGENT_DISPATCH_PUBLIC_KEY:?Set DIFFUSE_AGENT_DISPATCH_PUBLIC_KEY in .env}
      DIFFUSE_RUNNER_IMAGE_VERSION: ${DIFFUSE_CLAUDE_RUNNER_IMAGE:?Set DIFFUSE_CLAUDE_RUNNER_IMAGE to the release digest in .env}
      # The runner has no direct external network. Route vendor login and future
      # CLI calls through the allowlisted CONNECT proxy instead.
      HTTP_PROXY: http://egress-proxy-claude:3128
      HTTPS_PROXY: http://egress-proxy-claude:3128
      NO_PROXY: agent-tool-gateway,egress-proxy-claude,localhost,127.0.0.1
      DIFFUSE_AGENT_MODEL_HOST: ${DIFFUSE_CLAUDE_MODEL_HOST:-api.anthropic.com}
      DIFFUSE_AGENT_EGRESS_PROXY_HOST: egress-proxy-claude
      DIFFUSE_AGENT_TOOL_URL: http://agent-tool-gateway:8011/agent/v1
    volumes:
      - claude_agent_data:/var/lib/diffuse/agent
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [agent_mcp_claude, agent_egress_claude, runner_control_claude]

  agent-runner-codex:
    image: ${DIFFUSE_CODEX_RUNNER_IMAGE:?Set DIFFUSE_CODEX_RUNNER_IMAGE to the release digest in .env}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["agent-runner"]
    profiles: ["agent-codex"]
    healthcheck:
      test: ["CMD", "diffuse", "agent-runner-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 6
    depends_on:
      egress-proxy-codex:
        condition: service_healthy
    environment:
      HOME: /var/lib/diffuse/agent/home
      DIFFUSE_AGENT_HOME: /var/lib/diffuse/agent
      DIFFUSE_AGENT_RUNTIME: codex
      DIFFUSE_AGENT_DISPATCH_PUBLIC_KEY: ${DIFFUSE_AGENT_DISPATCH_PUBLIC_KEY:?Set DIFFUSE_AGENT_DISPATCH_PUBLIC_KEY in .env}
      DIFFUSE_RUNNER_IMAGE_VERSION: ${DIFFUSE_CODEX_RUNNER_IMAGE:?Set DIFFUSE_CODEX_RUNNER_IMAGE to the release digest in .env}
      HTTP_PROXY: http://egress-proxy-codex:3128
      HTTPS_PROXY: http://egress-proxy-codex:3128
      NO_PROXY: agent-tool-gateway,egress-proxy-codex,localhost,127.0.0.1
      DIFFUSE_AGENT_MODEL_HOST: ${DIFFUSE_CODEX_MODEL_HOST:-api.openai.com}
      DIFFUSE_AGENT_EGRESS_PROXY_HOST: egress-proxy-codex
      DIFFUSE_AGENT_TOOL_URL: http://agent-tool-gateway:8011/agent/v1
    volumes:
      - codex_agent_data:/var/lib/diffuse/agent
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [agent_mcp_codex, agent_egress_codex, runner_control_codex]

  # The gateway has no credentials and exposes a single capability-checked
  # tools route to runners, while it alone shares an internal network with app.
  agent-tool-gateway:
    image: ${DIFFUSE_IMAGE:?Set DIFFUSE_IMAGE to the release digest in .env}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["agent-tool-gateway"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [backend, agent_mcp_claude, agent_mcp_codex]

  egress-proxy-claude:
    image: ${DIFFUSE_IMAGE:?Set DIFFUSE_IMAGE to the release digest in .env}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["egress-proxy"]
    profiles: ["agent-claude"]
    environment:
      DIFFUSE_AGENT_MODEL_HOST: ${DIFFUSE_CLAUDE_MODEL_HOST:-api.anthropic.com}
    healthcheck:
      test: ["CMD", "diffuse", "egress-proxy-healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 10
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [agent_egress_claude, proxy_external]

  egress-proxy-codex:
    image: ${DIFFUSE_IMAGE:?Set DIFFUSE_IMAGE to the release digest in .env}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["egress-proxy"]
    profiles: ["agent-codex"]
    environment:
      DIFFUSE_AGENT_MODEL_HOST: ${DIFFUSE_CODEX_MODEL_HOST:-api.openai.com}
    healthcheck:
      test: ["CMD", "diffuse", "egress-proxy-healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 10
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [agent_egress_codex, proxy_external]

volumes:
  pgdata:
  repository_data:
  claude_agent_data:
  codex_agent_data:

networks:
  backend:
    internal: true
  agent_mcp_claude:
    internal: true
  agent_mcp_codex:
    internal: true
  runner_control_claude:
    internal: true
  runner_control_codex:
    internal: true
  agent_egress_claude:
    internal: true
  agent_egress_codex:
    internal: true
  proxy_external:
    internal: false
  control_egress:
    internal: false
