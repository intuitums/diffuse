name: diffuse

services:
  db:
    # Nothing in Diffuse uses pgvector any more: migration 0010 dropped the
    # embedding column and the extension. The image still ships it because
    # `sql/schema.sql` is the frozen version-1 migration and still runs
    # `CREATE EXTENSION IF NOT EXISTS vector` on a fresh install, which stock
    # `postgres:17` cannot satisfy. Swapping this is a one-line change once the
    # version-1 baseline is re-cut.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0}
    restart: unless-stopped
    environment:
      POSTGRES_USER: diffuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: diffuse
    # Docker's default /dev/shm is 64MB. PostgreSQL's parallel query workers
    # allocate dynamic shared memory there, and on a large snapshot a retrieval
    # query can fail with "could not resize shared memory segment". Raise this
    # further if a very large monorepo still hits that error.
    shm_size: 1gb
    # `db` is the only service not running with ALL capabilities dropped, because
    # the PostgreSQL entrypoint starts as root and needs CHOWN/SETUID/SETGID/FOWNER
    # /DAC_OVERRIDE to initialise the data directory and step down to the postgres
    # user. Those five are the whole set it needs; everything else goes.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffuse -d diffuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback-only, and overridable. The default is unchanged: one instance on one
    # machine gets 5432 where an operator expects it. DIFFUSE_DB_HOST_PORT exists for
    # hosts that already have something there - CI boots this stack on a box that also
    # runs Diffuse - where 0 asks the kernel for any free port.
    ports:
      - "127.0.0.1:${DIFFUSE_DB_HOST_PORT:-5432}:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 1m
    networks: [backend]

  migrate:
    image: ${DIFFUSE_IMAGE:?Set DIFFUSE_IMAGE to the release digest in .env}
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["database", "migrate"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [backend]

  app:
    image: ${DIFFUSE_IMAGE:?Set DIFFUSE_IMAGE to the release digest in .env}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
      DIFFUSE_API_TOKEN: ${DIFFUSE_API_TOKEN:?Set DIFFUSE_API_TOKEN in .env}
      DIFFUSE_PUBLIC_URL: ${DIFFUSE_PUBLIC_URL:?Set DIFFUSE_PUBLIC_URL in .env}
    ports:
      - "127.0.0.1:8000:8000"
    # REMOVED: a read-only bind mount of ${DIFFUSE_SECRETS_DIR:-/srv/diffuse/secrets}.
    # It existed for the browser sign-in client secret, and nothing reads a secret
    # from there: there is no `diffuse login` subcommand, so the flow cannot be
    # completed and operators are told to leave GITHUB_OAUTH_CLIENT_ID unset. An
    # unconditional bind mount of a host path nobody is told to create is worse than
    # useless - Compose silently creates it root-owned on first `up`. Reinstate it,
    # with the variable, when sign-in actually ships.
    volumes:
      - repository_data:/var/lib/diffuse/repositories
    tmpfs:
      - /tmp:size=256m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    networks: [backend, agent_mcp, control_egress]

  worker:
    image: ${DIFFUSE_IMAGE:?Set DIFFUSE_IMAGE to the release digest in .env}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ${DIFFUSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://diffuse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/diffuse
      # The image rootfs is read-only. Keep vendor fallback state (for example
      # Claude's legacy ~/.claude.json) beside the Diffuse-owned credential,
      # not under /home/diffuse or /tmp.
      DIFFUSE_AGENT_HOME: /var/lib/diffuse/agent
      HOME: /var/lib/diffuse/agent/home
    volumes:
      - repository_data:/var/lib/diffuse/repositories
      # Exactly one writer: vendor CLIs refresh their own OAuth credential, so
      # app intentionally does not mount this volume.
      - agent_data:/var/lib/diffuse/agent
    tmpfs:
      - /tmp:size=512m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    networks: [backend, control_egress]

  # This one-shot assertion runs as the same identity and on the same networks
  # a future agent session will use. It deliberately has no `env_file`: the
  # worker's env file contains control-plane and database credentials.
  #
  # Opt-in, via `docker compose --profile agent up`. No agent runtime is
  # selectable yet, so nothing in the running stack needs this. It was briefly a
  # `depends_on` of the worker, which meant the entire review pipeline refused
  # to start unless a live CONNECT to the model API succeeded -- a hard boot
  # dependency on one vendor's reachability, for operators who may well be
  # running another provider or none.
  agent-preflight:
    image: ${DIFFUSE_IMAGE:?Set DIFFUSE_IMAGE to the release digest in .env}
    restart: "no"
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["review-compartment-preflight"]
    profiles: ["agent"]
    healthcheck:
      disable: true
    depends_on:
      egress-proxy:
        condition: service_healthy
    environment:
      HOME: /var/lib/diffuse/agent
      DIFFUSE_AGENT_HOME: /var/lib/diffuse/agent
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: app,egress-proxy,localhost,127.0.0.1
      # The allowlist follows whichever provider the operator configured;
      # hardcoding one vendor made the check meaningless for the others.
      DIFFUSE_AGENT_MODEL_HOST: ${DIFFUSE_AGENT_MODEL_HOST:-api.anthropic.com}
    tmpfs:
      - /tmp:size=64m,mode=1777
      # DEV-333 replaces this ephemeral mount with its managed credential-home
      # lifecycle. It is private even for this preflight-only service.
      - /var/lib/diffuse/agent:size=64m,mode=0700,uid=10001,gid=10001
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [agent_mcp, agent_egress]

  # Same digest-pinned release image as the application, never an unpinned
  # third-party proxy tag. This is a CONNECT allowlist, not a TLS boundary.
  egress-proxy:
    image: ${DIFFUSE_IMAGE:?Set DIFFUSE_IMAGE to the release digest in .env}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["egress-proxy"]
    profiles: ["agent"]
    environment:
      DIFFUSE_AGENT_MODEL_HOST: ${DIFFUSE_AGENT_MODEL_HOST:-api.anthropic.com}
    healthcheck:
      test: ["CMD", "diffuse", "egress-proxy-healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 10
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [agent_egress, proxy_external]

volumes:
  pgdata:
  repository_data:
  agent_data:

networks:
  backend:
    internal: true
  agent_mcp:
    internal: true
  agent_egress:
    internal: true
  proxy_external:
    internal: false
  control_egress:
    internal: false
