[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diffuse-server"
version = "0.1.0"
description = "Self-hosted Diffuse review server"
requires-python = ">=3.12"
license = "BUSL-1.1"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "diffuse-host==0.1.0",
    "diffuse-protocol==0.1.0",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg2-binary>=2.9,<3",
    "pydantic>=2.10,<3",
    "pyjwt[crypto]>=2.10,<3",
    "tree-sitter>=0.25,<1",
    "tree-sitter-c>=0.23,<1",
    "tree-sitter-cpp>=0.23,<1",
    "tree-sitter-go>=0.23,<1",
    "tree-sitter-java>=0.23,<1",
    "tree-sitter-javascript>=0.23,<1",
    "tree-sitter-php>=0.23,<1",
    "tree-sitter-ruby>=0.23,<1",
    "tree-sitter-rust>=0.23,<1",
    "tree-sitter-typescript>=0.23,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
diffuse = "diffuse.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["diffuse*"]

[tool.setuptools.data-files]
"share/diffuse/sql" = ["migrations/*.sql", "migrations/README.md"]
