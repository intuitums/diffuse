[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diffuse-host"
version = "0.1.0"
description = "Credential-isolated Agent Host for Diffuse"
requires-python = ">=3.12"
license = "BUSL-1.1"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "diffuse-protocol==0.1.0",
    "fastapi>=0.115,<1",
    "mcp>=1.27,<2",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["diffuse_host*"]
