[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diffuse-relay"
version = "0.1.0"
description = "Public GitHub event and credential relay for Diffuse"
requires-python = ">=3.12"
license = "BUSL-1.1"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "cryptography>=44,<51",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg2-binary>=2.9,<3",
    "pydantic>=2.10,<3",
    "pyjwt[crypto]>=2.10,<3",
    "python-multipart>=0.0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["diffuse_relay*"]

[tool.setuptools.data-files]
"share/diffuse-relay/migrations" = ["migrations/*.sql"]
